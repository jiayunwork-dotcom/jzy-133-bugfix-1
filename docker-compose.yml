services:
  postgres:
    image: postgres:16-alpine
    container_name: spc-postgres
    environment:
      POSTGRES_USER: spc
      POSTGRES_PASSWORD: spc
      POSTGRES_DB: spc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spc -d spc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: spc-backend
    environment:
      DATABASE_URL: postgres://spc:spc@postgres:5432/spc?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: spc-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
